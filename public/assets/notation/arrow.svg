<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" fill="none">
  <defs>
    <filter id="roughen-arrow" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="2.5" />
    </filter>
  </defs>
  <!--
    Arrow: shaft curves slightly upward then down.
    Head is two strokes at roughly 30° off the shaft.
    Color via currentColor.
  -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#roughen-arrow)">
    <path d="M 20,55 C 80,35 140,75 200,50" />
    <path d="M 200,50 L 180,35" />
    <path d="M 200,50 L 180,65" />
  </g>
</svg>
