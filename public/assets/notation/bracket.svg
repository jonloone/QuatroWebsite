<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 200" width="40" height="200" fill="none">
  <defs>
    <filter id="roughen-bracket" x="-20%" y="-5%" width="140%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" />
      <feDisplacementMap in="SourceGraphic" scale="2" />
    </filter>
  </defs>
  <!--
    Left-facing square bracket. Flip horizontally for right-facing.
    Top tick, vertical stroke, bottom tick. Stroke thickness 3px.
  -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#roughen-bracket)">
    <path d="M 28,12 L 12,12 L 12,188 L 28,188" />
  </g>
</svg>
