[build]
  command = "npm install --prefer-offline --no-audit --force && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--force"

# Legacy /platform URLs → /utility (edge redirects)
[[redirects]]
  from = "/platform/*"
  to = "/utility/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/es/platform/*"
  to = "/es/"
  status = 301
  force = true

# /utility (index) replaced by /how-it-works (HIW-1)
[[redirects]]
  from = "/utility"
  to = "/how-it-works"
  status = 301
  force = true

# /utility/how-it-starts replaced by /how-it-works/engagement (HIW-2)
[[redirects]]
  from = "/utility/how-it-starts"
  to = "/how-it-works/engagement"
  status = 301
  force = true

# /utility/technology retired; depth moved to /how-it-works/architecture (HIW-4, §3 target)
[[redirects]]
  from = "/utility/technology"
  to = "/how-it-works"
  status = 301
  force = true

# Retired and folded industries (IND-6, §7)
