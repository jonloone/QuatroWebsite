<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <filter id="roughen-starburst" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="6" />
      <feDisplacementMap in="SourceGraphic" scale="2.5" />
    </filter>
  </defs>
  <!--
    Four asymmetric radiating strokes.
    Unequal lengths and spacing — the asymmetry is the point.
    The starburst signals "a moment of detection" — a signal found, an anomaly caught.
  -->
  <g stroke="currentColor" stroke-width="3" stroke-linecap="round" filter="url(#roughen-starburst)">
    <path d="M 60,60 L 60,12" />
    <path d="M 60,60 L 100,30" />
    <path d="M 60,60 L 108,70" />
    <path d="M 60,60 L 42,106" />
    <path d="M 60,60 L 16,82" />
  </g>
</svg>
